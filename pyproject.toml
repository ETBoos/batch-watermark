[project]
name = "batch-watermark"
version = "1.1.2"
description = "视频批量图片水印工具 — 批量给视频叠加图片水印"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "PySide6>=6.6.0",
    "Pillow>=10.0.0",
    "psutil>=5.9.0",
]

[project.scripts]
batch-watermark = "batch_watermark.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/batch_watermark"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/scripts",
    "/README.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
